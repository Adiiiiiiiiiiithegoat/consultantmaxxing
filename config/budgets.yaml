# Per-run budgets. A run halts cleanly (checkpoint + stop) when any cap is hit.
profiles:
  dev:
    max_tokens: 60000
    max_calls: 120
    max_searches: 20
    max_pages: 30
    eval_cases: 3
    max_iterations: 2      # evidence/assess loops
    max_questions: 10      # case mode: questions to the client
    max_research: 3        # questions researched per iteration
  claude: &claude          # Claude via the subscription CLI (models.claude.yaml): sized for a
    max_tokens: 1000000    # strong model with long prompts (tokens incl. prompt-cache reads);
    max_calls: 250         # the plan's 5-hour window, not money, is the real limit. Revisit
    max_searches: 40       # after the first measured engagement (PROGRESS.md).
    max_pages: 60
    eval_cases: 6
    max_iterations: 3
    max_questions: 12      # the reference interviews have a median of 9 candidate turns
    max_research: 4
  claude-single:           # ablation B: the claude profile, but one storyliner call writes the
    <<: *claude            # answer from the full transcript, the decision model and all facts;
    synthesis: single      # one partner review, one revision if it blocks, best draft ships
  agent: &agent            # the single agent (consultant/agent.py), case mode: C's caps
    max_tokens: 2000000    # (8 questions, 4 analyses) plus research; tokens incl. cache reads
    max_calls: 300
    max_searches: 12
    max_pages: 24
    eval_cases: 18
    max_questions: 8
    max_analyses: 4
    max_research: 3
  agent-partner:           # the agent with partner review: one review, one revision, the
    <<: *agent             # better-reviewed draft ships
    partner: true
  agent-real:              # real mode (`consult new`): no interviewer, research everything
    <<: *agent
    max_searches: 40
    max_pages: 80
    max_analyses: 6
    max_research: 10
  full:
    max_tokens: 400000
    max_calls: 800
    max_searches: 120
    max_pages: 200
    eval_cases: 15
    max_iterations: 4
    max_questions: 25
    max_research: 6
