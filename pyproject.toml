[project]
name = "consultantmaxxing"
version = "0.1.0"
description = "AI strategy/management consultant"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "httpx>=0.27",
    "openai>=1.50",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pydantic>=2.7",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consultant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes real API calls (run with -m live)"]
addopts = "-m 'not live'"
