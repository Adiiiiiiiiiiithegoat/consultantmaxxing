# PROPOSED fresh held-out fact-finding questions (2026-10-14), for the user to spot-check.
# NOT used by any code, not run, and never to be used while developing: once checked, they
# replace the current biased held-out half (see fact_questions.yaml) as the honest measure.
#
# How the answers were found: web search on 2026-10-14; `source` is the document the figure
# comes from (primary where one was found). I did not open every primary PDF myself, so
# `confidence` says how directly the figure was confirmed. Please check each `source` and fix
# `answer` / `tol` before use. Format matches fact_questions.yaml (`answer` in base units).
# None overlap the 20 gate questions, the 3 dev questions or the excluded companies
# (Wipro, HUL, ITC, Paytm). Dropped while researching: Bajaj Finance FY24 PAT (sources split
# on standalone vs consolidated), Railways FY24 freight loading (1,588 vs 1,591 MT).
questions:
  - id: merch_exports_fy24
    question: "What was the value of India's merchandise exports in FY2023-24, in US dollars?"
    answer: 4.3706e+11
    unit: USD
    tol: 0.02
    as_written: "USD 437.06 billion (Commerce Ministry release, 15 Apr 2024)"
    source: https://commerce.gov.in/wp-content/uploads/2024/04/PIB-Release.pdf
    source_type: primary (government)
    confidence: high
    caveat: "a Feb 2025 PIB note restates it as USD 437.10 billion (inside tol)"
